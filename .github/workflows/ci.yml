name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
          cache-dependency-path: |
            **/*.sbt
            **/project/build.properties
            **/project/*Plugin.scala

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Test and publish library locally for both Scala versions
        working-directory: play-cxf
        run: sbt --batch +test +publishLocal

      - name: Test example for both Scala versions
        working-directory: examples/play-cxf-example
        run: sbt --batch +test
